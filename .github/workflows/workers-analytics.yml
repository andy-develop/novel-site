name: workers-analytics

# Temporary diagnostic: 24h Workers invocations/CPU, plus zone-level request
# paths when the token allows it. Prints aggregates only (no account/zone ids).

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/workers-analytics.yml'

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Query Workers analytics
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, datetime as dt, collections

          tok = os.environ['CF_TOKEN']

          def api(path, payload=None):
              req = urllib.request.Request(
                  'https://api.cloudflare.com/client/v4/' + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'})
              try:
                  return json.loads(urllib.request.urlopen(req, timeout=90).read())
              except urllib.error.HTTPError as e:
                  return {'errors': [{'code': e.code, 'message': e.read().decode()[:300]}]}

          accounts = api('accounts')
          if not accounts.get('result'):
              print('ACCOUNT_READ_FAILED', accounts.get('errors')); raise SystemExit(0)
          acct = accounts['result'][0]['id']

          now = dt.datetime.now(dt.UTC)
          f = (now - dt.timedelta(hours=24)).strftime('%Y-%m-%dT%H:00:00Z')
          t = now.strftime('%Y-%m-%dT%H:00:00Z')
          print('window_utc', f, '->', t)

          q1 = """query($a:String!,$f:Time!,$t:Time!){viewer{accounts(filter:{accountTag:$a}){
            workersInvocationsAdaptive(limit:10000,filter:{datetime_geq:$f,datetime_lt:$t}){
              sum{requests errors}
              quantiles{cpuTimeP50 cpuTimeP99}
              dimensions{scriptName status datetimeHour}}}}}"""
          r = api('graphql', {'query': q1, 'variables': {'a': acct, 'f': f, 't': t}})
          if r.get('errors'):
              print('GQL_ERROR', r['errors']); raise SystemExit(0)
          rows = r['data']['viewer']['accounts'][0]['workersInvocationsAdaptive']

          print('-- hourly x status (novel-site)')
          per = collections.defaultdict(collections.Counter)
          cpu = {}
          for x in rows:
              d = x['dimensions']
              if d['scriptName'] != 'novel-site':
                  continue
              h = d['datetimeHour'][:13]
              per[h][d['status']] += x['sum']['requests']
              p = cpu.setdefault(h, [0, 0])
              p[0] = max(p[0], x['quantiles']['cpuTimeP50'] or 0)
              p[1] = max(p[1], x['quantiles']['cpuTimeP99'] or 0)
          for h in sorted(per):
              s = per[h]
              print(f"  {h}  total={sum(s.values()):>5d}  " + '  '.join(f'{k}={v}' for k, v in s.most_common())
                    + f"  p50={cpu[h][0]}  p99={cpu[h][1]}")

          zones = api('zones?per_page=50')
          zl = zones.get('result') or []
          print('zones_visible', len(zl))
          if not zl:
              print('ZONE_ERROR', zones.get('errors'))
              raise SystemExit(0)

          zone = zl[0]['id']
          q2 = """query($z:String!,$f:Time!,$t:Time!){viewer{zones(filter:{zoneTag:$z}){
            httpRequestsAdaptiveGroups(limit:40,filter:{datetime_geq:$f,datetime_lt:$t},orderBy:[count_DESC]){
              count
              dimensions{clientRequestPath clientRequestHTTPMethodName edgeResponseStatus}}}}}"""
          r2 = api('graphql', {'query': q2, 'variables': {'z': zone, 'f': f, 't': t}})
          if r2.get('errors') or not r2.get('data'):
              print('PATH_GQL_ERROR', r2.get('errors'))
          else:
              groups = r2['data']['viewer']['zones'][0]['httpRequestsAdaptiveGroups']
              print('-- top request paths (zone)')
              for g in groups:
                  d = g['dimensions']
                  print(f"  {g['count']:>7d}  {d['edgeResponseStatus']}  {d['clientRequestHTTPMethodName']}  {d['clientRequestPath'][:70]}")

          q3 = """query($z:String!,$f:Time!,$t:Time!){viewer{zones(filter:{zoneTag:$z}){
            httpRequestsAdaptiveGroups(limit:15,filter:{datetime_geq:$f,datetime_lt:$t},orderBy:[count_DESC]){
              count dimensions{clientRequestHTTPHost clientRequestScheme}}}}}"""
          r3 = api('graphql', {'query': q3, 'variables': {'z': zone, 'f': f, 't': t}})
          if not r3.get('errors') and r3.get('data'):
              print('-- hosts')
              for g in r3['data']['viewer']['zones'][0]['httpRequestsAdaptiveGroups']:
                  print('  ', g['count'], g['dimensions'])
          PY