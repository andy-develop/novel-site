name: Publish novel data to R2

# The CLOUDFLARE_API_TOKEN in this repo is scoped for Workers deploy, not the R2
# admin API (wrangler r2 object put returns 403). So this job deploys a tiny
# writer Worker that holds an R2 binding to `novel-data`; the caller then PUTs the
# prepared payload through it. Delete the worker (novel-publisher) when done.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Free-text note for the run log"
        required: false
        default: "deploy R2 writer"

jobs:
  deploy-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve account id
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ACC=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts \
                | python3 -c "import json,sys;print(json.load(sys.stdin)['result'][0]['id'])")
          echo "account=$ACC"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"

      - name: Deploy R2 writer worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@3.99.0 deploy --config publish-worker/wrangler.toml publish-worker/index.js
          echo "publisher deployed"

  delete-publisher:
    if: ${{ inputs.note == 'delete' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete the temporary writer worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ACC=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts \
                | python3 -c "import json,sys;print(json.load(sys.stdin)['result'][0]['id'])")
          curl -fsS -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/novel-publisher"
          echo "deleted novel-publisher"
