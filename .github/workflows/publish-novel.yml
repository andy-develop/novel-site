name: Publish novel data to R2

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Free-text note for the run log"
        required: false
        default: "deploy R2 writer"

jobs:
  deploy-publisher:
    if: ${{ inputs.note != 'delete' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve account id
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ACC=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts \
                | python3 -c "import json,sys;print(json.load(sys.stdin)['result'][0]['id'])")
          echo "account=$ACC"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"

      - name: Upload R2 writer worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          npx --yes wrangler@3.99.0 deploy --config publish-worker/wrangler.toml publish-worker/index.js || true
          echo "upload step finished"

      - name: Enable workers.dev route
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/novel-publisher-21/subdomain"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /tmp/sub.json -w "%{http_code}" --max-time 30 -X POST \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              -d '{"enabled":true,"previews_enabled":false}' "$URL")
            if [ "$CODE" != "200" ]; then
              CODE=$(curl -sS -o /tmp/sub.json -w "%{http_code}" --max-time 30 -X PUT \
                -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
                -d '{"enabled":true,"previews_enabled":false}' "$URL")
            fi
            echo "attempt $i -> $CODE"
            cat /tmp/sub.json; echo
            if [ "$CODE" = "200" ]; then break; fi
            sleep 8
          done

  delete-publisher:
    if: ${{ inputs.note == 'delete' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete the temporary writer worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ACC=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts \
                | python3 -c "import json,sys;print(json.load(sys.stdin)['result'][0]['id'])")
          for N in novel-publisher novel-publisher-2 novel-publisher-3 novel-publisher-4 novel-publisher-5 novel-publisher-6 novel-publisher-7 novel-publisher-8 novel-publisher-9 novel-publisher-10 novel-publisher-11 novel-publisher-12 novel-publisher-13 novel-publisher-14 novel-publisher-15 novel-publisher-16 novel-publisher-17 novel-publisher-18 novel-publisher-19 novel-publisher-20 novel-publisher-21; do
            curl -sS -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$N?force=true" || true
          done
          sleep 10
          echo "after:"
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts" | head -c 400; echo
